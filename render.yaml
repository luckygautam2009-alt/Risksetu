# RISKSETU AI — Render.com Blueprint Specification
# Deploys:
# 1. PostgreSQL with PostGIS database
# 2. Backend FastAPI Web Service (Docker)
# 3. Frontend React + Vite Static Site

services:
  # --- 1. Backend Web Service (FastAPI) ---
  - type: web
    name: risksetu-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: risksetu-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        value: "https://risksetu-frontend.onrender.com,http://localhost:5173"
      - key: OFFLINE_DEMO_MODE
        value: "true"

  # --- 2. Frontend Static Site (React + Vite) ---
  - type: static
    name: risksetu-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: risksetu-backend
          property: url

databases:
  - name: risksetu-db
    plan: standard
    region: oregon
    postgresMajorVersion: 16
